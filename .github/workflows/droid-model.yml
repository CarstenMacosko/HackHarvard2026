# Droid builds a study-specific CV model and opens a draft pull request for review.
#
# Started from the web app (Workflow builder → "Generate model with Droid", which calls
# POST /api/droid/jobs → workflow_dispatch) or by hand:
#   gh workflow run droid-model.yml -f request='{"request_id":"psoriasis-scaling-1","condition":"Plaque psoriasis",
#     "measurement":{"name":"scaling_score","label":"Scaling","unit":"0-4"},"media_type":"photo","description":"..."}'
#
# Setup: add the FACTORY_API_KEY repository secret, and allow Actions to create pull requests
# (Settings → Actions → General → Workflow permissions). See docs/DROID.md.
name: Droid · new study model
# the request id in brackets lets the web app match runs to requests (lib/droid.ts)
run-name: "Droid model: ${{ fromJSON(inputs.request).measurement.label }} for ${{ fromJSON(inputs.request).condition }} [${{ fromJSON(inputs.request).request_id }}]"

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Study model request as JSON (see training/scripts/droid_request.py)"
        required: true
        type: string
      model:
        description: "Droid model id (blank = Factory's default)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  model:
    name: Generate study model
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: a failing command in a pipeline fails the step
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false # Droid never holds push credentials; the last step pushes

      - name: Validate the request
        id: req
        env:
          DROID_REQUEST: ${{ inputs.request }} # untrusted text: parsed in Python, never inlined into shell
        run: python3 training/scripts/droid_request.py

      - name: Check the Factory API key
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::Add the FACTORY_API_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            training/requirements.txt
            services/cv/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 ffmpeg
          pip install -r training/requirements.txt
          npm ci

      - name: Restore cached datasets and features
        uses: actions/cache@v4
        with:
          path: training/.cache
          key: vfcv-cache-${{ hashFiles('training/vfcv/datasets/*.py') }}-${{ github.run_id }}
          restore-keys: |
            vfcv-cache-${{ hashFiles('training/vfcv/datasets/*.py') }}-
            vfcv-cache-

      - name: Install Droid
        run: |
          npm install -g @factory/cli@0.244.0
          droid --version

      - name: Droid builds the model
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          DROID_MODEL: ${{ inputs.model }}
        run: |
          args=(exec --auto high -f .github/droid/new-study-model.md)
          if [ -n "$DROID_MODEL" ]; then args+=(-m "$DROID_MODEL"); fi
          droid "${args[@]}" 2>&1 | tee .droid/droid.log

      - name: Gate (allowed paths, study outputs, bundle)
        id: gate
        run: python training/scripts/droid_gate.py

      - name: Tests
        run: |
          (cd training && python -m pytest -q && python -m vfcv.run studies/* --check)
          (cd services/cv && python -m pytest -q)
          npm test

      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.req.outputs.request_id }}
          OUTCOME: ${{ steps.gate.outputs.outcome }}
        run: |
          label=$(python3 -c "import json; r=json.load(open('.droid/request.json')); print(r['measurement']['label'] + ' for ' + r['condition'])")
          branch="droid/model-${REQUEST_ID}"
          title="Droid: ${label}"
          if [ "$OUTCOME" = "needs_data" ]; then title="${title} (needs data)"; fi
          git config user.name "droid-model[bot]"
          git config user.email "droid-model@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- . ':(exclude).droid'
          git commit -m "$title" -m "Requested from the workflow builder (request ${REQUEST_ID}); generated by Factory Droid with the training kit."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          { cat .droid/summary.md 2>/dev/null || echo "Droid did not write a summary."; echo; cat .droid/gate.md; echo; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; } > .droid/pr.md
          gh pr create --draft --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" --body-file .droid/pr.md

      - name: Job summary
        if: always()
        run: |
          { echo "### Request"; echo '```json'; cat .droid/request.json 2>/dev/null; echo '```'; cat .droid/gate.md 2>/dev/null; cat .droid/summary.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Droid's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-${{ steps.req.outputs.request_id || github.run_id }}
          path: .droid/
          if-no-files-found: ignore
